<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

    <title>Login | Al-Aqsa Islami Academy</title>

    <link href="{{url_for('static', filename='img/al-aqsa-icon.jpg')}}" rel="icon">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">

    <!-- Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Baloo+Da+2:wght@500;600;700;800&display=swap"
          rel="stylesheet">

    <style>
        body {
            margin: 0;
        }

        /* mobile app container */
        .app-container {
            max-width: 420px;
            margin: auto;
            padding: 0 16px 30px;
        }

        /* HEADING */
        .login-head {
            position: relative;
            text-align: center;
            padding: 34px 0 18px;
        }

        .logo-badge {
            width: 112px;
            height: 112px;
            margin: 0 auto 12px;
            border-radius: 50%;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 4px solid #ecfdf5;
            box-shadow: 0 6px 0 #a7f3d0, 0 12px 24px rgba(0, 0, 0, .06);
            animation: bounce 2.4s ease-in-out infinite;
        }

        .logo {
            width: 80px;
        }

        .school-name {
            font-weight: 800;
            font-size: 26px;
            line-height: 1.2;
            margin-bottom: 8px;
            color: #059669;
        }

        .salam {
            display: inline-block;
            font-weight: 700;
            font-size: 16px;
            color: white;
            padding: 3px 16px;
            border-radius: 999px;
            background: linear-gradient(135deg, #34d399 0%, #22d3ee 45%, #818cf8 100%);
            box-shadow: 0 4px 0 rgba(0, 0, 0, .08);
        }

        .deco {
            position: absolute;
            animation: twinkle 3s ease-in-out infinite;
        }

        .deco.d1 { top: 30px; left: 8px; font-size: 22px; color: #fbbf24; }
        .deco.d2 { top: 70px; right: 6px; font-size: 26px; color: #f472b6; animation-delay: 1s; }
        .deco.d3 { top: 120px; left: 26px; font-size: 16px; color: #818cf8; animation-delay: 2s; }

        /* LOGIN CARD (rainbow top like the page headers) */
        .login-card {
            position: relative;
            overflow: hidden;
            padding: 30px 20px 24px;
            border-radius: 24px;
            background: white;
            border: 3px solid var(--soft);
            box-shadow: 0 6px 0 var(--soft), 0 12px 26px rgba(0, 0, 0, .06);
        }

        .login-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 6px;
            background: linear-gradient(90deg, #34d399, #22d3ee, #818cf8, #f472b6, #fb923c, #fbbf24);
        }

        .login-title {
            font-weight: 800;
            font-size: 22px;
            color: var(--c2);
            text-align: center;
            margin-bottom: 18px;
        }

        .login-title i {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            margin-right: 6px;
            border-radius: 12px;
            color: white;
            font-size: 18px;
            background: linear-gradient(135deg, var(--c1), var(--c2));
            transform: rotate(-6deg);
            vertical-align: middle;
        }

        .form-floating > label {
            font-weight: 600;
            color: #64748b;
        }

        #togglePassword {
            color: var(--c2);
        }

        /* login button */
        .login-btn {
            height: 52px;
            font-size: 18px;
        }

        .login-error {
            font-weight: 600;
            color: #e11d48;
            background: #fff1f2;
            border-radius: 12px;
            padding: 6px 10px;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        @keyframes twinkle {
            0%, 100% { opacity: .4; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        @media (prefers-reduced-motion: reduce) {
            .logo-badge, .deco { animation: none; }
        }
    </style>
    <link href="{{ url_for('static', filename='css/kids.css') }}" rel="stylesheet">
</head>

<body class="kids t-green">

<div class="app-container">

    <!-- Heading -->
    <div class="login-head">
        <i class="bi bi-star-fill deco d1"></i>
        <i class="bi bi-stars deco d2"></i>
        <i class="bi bi-moon-stars-fill deco d3"></i>

        <div class="logo-badge">
            <img src="{{url_for('static', filename='img/al-aqsa-logo.png')}}" alt="Al-Aqsa Logo" class="logo">
        </div>

        <h3 class="school-name">Al-Aqsa Islami Academy</h3>
        <span class="salam">আসসালামু আলাইকুম</span>
    </div>

    <!-- Login Card -->
    <div class="login-card">
        <div class="login-title"><i class="bi bi-door-open-fill"></i>Login</div>

        <form method="POST" action="{{ url_for('login') }}">

            <div class="form-floating mb-3">
                <input type="text" id="username" name="username" class="form-control" placeholder="Username"
                       required>
                <label for="username">Username</label>
            </div>

            <div class="position-relative mb-3">
                <div class="form-floating">
                    <input type="password"
                           id="password"
                           name="password"
                           class="form-control pe-5"
                           placeholder="Password"
                           required>
                    <label for="password">Password</label>
                </div>

                <button type="button"
                        id="togglePassword"
                        class="btn border-0 position-absolute top-50 end-0 translate-middle-y me-2"
                        aria-label="Show password">
                    <i id="eyeIcon" class="bi bi-eye"></i>
                </button>
            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
            <p class="login-error text-center small">
                <i class="bi bi-exclamation-circle-fill me-1"></i>{{ message }}
            </p>
            {% endfor %}
            {% endwith %}

            <button class="btn btn-success w-100 login-btn">Login</button>

        </form>
    </div>

</div>

<script>
    const passwordInput = document.getElementById("password");
    const togglePassword = document.getElementById("togglePassword");
    const eyeIcon = document.getElementById("eyeIcon");

    togglePassword.addEventListener("click", function () {
        if (passwordInput.type === "password") {
            passwordInput.type = "text";
            eyeIcon.classList.remove("bi-eye");
            eyeIcon.classList.add("bi-eye-slash");
        } else {
            passwordInput.type = "password";
            eyeIcon.classList.remove("bi-eye-slash");
            eyeIcon.classList.add("bi-eye");
        }
    });
</script>

</body>
</html>
